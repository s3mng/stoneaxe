name: Signed release and Homebrew cask
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Packaging/Info.plist)
          echo "STONEAXE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Import signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/stoneaxe.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/stoneaxe.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/stoneaxe.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/stoneaxe.keychain-db"
          security import "$RUNNER_TEMP/stoneaxe.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/stoneaxe.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/stoneaxe.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/stoneaxe.keychain-db" login.keychain-db
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials stoneaxe-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Sign and notarize
        env:
          STONEAXE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          STONEAXE_NOTARY_PROFILE: stoneaxe-ci
        run: bash scripts/release.sh
      - name: Generate Homebrew cask
        run: ruby scripts/generate-cask.rb "$GITHUB_REPOSITORY" "dist/Stoneaxe-$STONEAXE_VERSION-arm64.zip" dist/stoneaxe.rb "$STONEAXE_VERSION"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$STONEAXE_VERSION" --target "$GITHUB_SHA" --draft --generate-notes --title "Stoneaxe $STONEAXE_VERSION" "dist/Stoneaxe-$STONEAXE_VERSION-arm64.zip" dist/stoneaxe.rb
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/stoneaxe.keychain-db" || true
